<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Lakon di IOITE Expo 2026</title>
<style>
  :root{--bg:#F3F1EC;--card:#FFFFFF;--ink:#1A1A1A;--muted:#6B6259;--line:#E1DED4;--red:#E8431A;--orange:#F7941D}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    font-family:"Albert Sans",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 22px;max-width:420px;width:100%;
    text-align:center;box-shadow:0 6px 24px rgba(60,40,20,.08)}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--red);margin-bottom:8px}
  h1{font-size:22px;line-height:1.25;margin:0 0 10px}
  .hari{display:inline-block;background:var(--orange);color:#1A1A1A;font-weight:700;font-size:14px;
    padding:6px 14px;border-radius:999px;margin-bottom:14px}
  p{color:var(--muted);font-size:15px;margin:0 0 18px}
  .btn{display:block;background:var(--red);color:#fff;text-decoration:none;font-weight:700;font-size:16px;
    padding:15px 18px;border-radius:14px;min-height:52px;display:grid;place-items:center}
  .kecil{font-size:13px;color:var(--muted);margin:14px 0 0}
  .pilihan{margin-top:14px;font-size:14px}
  .pilihan a{color:var(--red);text-decoration:none;font-weight:600;margin:0 5px;display:inline-block;padding:6px 0}
</style>
</head>
<body>
<main class="card">
  <div class="eyebrow">Mitologi Inspira</div>
  <h1>Tes Lakon di IOITE Expo 2026</h1>
  <div class="hari" id="label">Menyiapkan hari ini</div>
  <p id="pesan">Sebentar, halaman tes akan terbuka sendiri dengan kode promo hari ini.</p>
  <a class="btn" id="tombol" href="https://lakonprofile.com/tes/">Buka tes Lakon sekarang</a>
  <p class="kecil">Jika belum terbuka otomatis, ketuk tombol di atas.</p>
  <p class="pilihan" id="pilihan"></p>
</main>
<script>
(function () {
  /* Satu halaman untuk empat hari. Kode voucher dipilih sesuai tanggal WIB. */
  var BATCH = 'b-2q9rck42cf';
  var PERUSAHAAN = 'Pengunjung IOITE Expo 2026';
  var HARI = {
    '2026-10-08': { kode: 'IOITE-D1', nama: 'Hari 1, 8 Oktober' },
    '2026-10-09': { kode: 'IOITE-D2', nama: 'Hari 2, 9 Oktober' },
    '2026-10-10': { kode: 'IOITE-D3', nama: 'Hari 3, 10 Oktober' },
    '2026-10-11': { kode: 'IOITE-D4', nama: 'Hari 4, 11 Oktober' }
  };

  function tanggalWib() {
    var d = new Date(Date.now() + 7 * 3600 * 1000);
    return d.toISOString().slice(0, 10);
  }

  function tautan(kode) {
    var u = 'https://lakonprofile.com/tes/?batch=' + BATCH +
            '&perusahaan=' + encodeURIComponent(PERUSAHAAN);
    if (kode) { u += '&v=' + encodeURIComponent(kode); }
    return u;
  }

  var p = new URLSearchParams(location.search);
  var paksa = (p.get('hari') || '').trim();
  var URUT = ['2026-10-08', '2026-10-09', '2026-10-10', '2026-10-11'];
  var hariIni = tanggalWib();
  var info = HARI[hariIni];
  var kode = info ? info.kode : null;

  if (paksa && /^[1-4]$/.test(paksa)) {
    var urut = URUT[parseInt(paksa, 10) - 1];
    kode = 'IOITE-D' + paksa;
    info = HARI[urut] || info;
  }

  var tombol = document.getElementById('tombol');
  var label = document.getElementById('label');
  var pesan = document.getElementById('pesan');

  if (kode) {
    tombol.href = tautan(kode);
    label.textContent = info ? info.nama : ('Kode ' + kode);
    pesan.textContent = 'Halaman tes terbuka otomatis dengan kode promo hari ini. Tanpa mengetik apa pun.';
    setTimeout(function () { location.replace(tombol.href); }, 1400);
  } else {
    tombol.href = tautan(null);
    label.textContent = 'Di luar hari pameran';
    pesan.textContent = 'Hari ini bukan tanggal pameran 8 sampai 11 Oktober 2026. Tes tetap bisa dibuka, '
      + 'silakan tanyakan kode promo kepada petugas di booth.';
  }

  /* Pintasan untuk petugas: ?hari=1 sampai ?hari=4, kalau perlu memaksa hari tertentu. */
  var pilihan = document.getElementById('pilihan');
  var isi = 'Untuk petugas: ';
  for (var i = 1; i <= 4; i++) {
    isi += '<a href="?hari=' + i + '">Hari ' + i + '</a>';
  }
  pilihan.innerHTML = isi;
})();
</script>
</body>
</html>
