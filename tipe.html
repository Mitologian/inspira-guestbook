<html lang="id">
<head>

<style>
/* Satu kolom HP: bar kembali, judul, tab, kartu detail berwarna pastel, grid chip berkode warna */
:root{
  --bg:#F3F1EC; --card:#FFFFFF; --ink:#1A1A1A; --muted:#6B6259; --line:#E1DED4; --tint:#EAE7DF;
  --red-text:#D5390F; --orange:#F7941D;
  --display:Montserrat,"Albert Sans",system-ui,sans-serif; --body:"Albert Sans",system-ui,sans-serif;
  --pbg:#FFEBD6; --pink:#9A500F;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.55;font-size:16px}
a{color:inherit}
button{font:inherit;cursor:pointer;color:inherit}
.wrap{max-width:480px;margin:0 auto;padding-inline:22px}
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  padding-top:env(safe-area-inset-top,0px)}
.bar .wrap{display:flex;align-items:center;gap:10px;min-height:52px}
.back{display:inline-flex;align-items:center;gap:4px;text-decoration:none;font-size:14px;font-weight:600;color:var(--muted);min-height:44px;padding-right:8px}
.back svg{width:18px;height:18px}
header.wrap{padding-block:8px 18px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:var(--red-text)}
h1{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.1;margin:6px 0 8px;text-wrap:balance}
.lead{color:var(--muted);font-size:14px;max-width:34ch}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--tint);border-radius:999px;margin-bottom:16px}
.tabs button{min-height:42px;border:0;border-radius:999px;background:transparent;font-size:13px;font-weight:600;color:var(--muted);transition:background .2s,color .2s}
.tabs button[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(60,40,20,.12)}
.tabs button:focus-visible,.chip:focus-visible,.back:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

.detail{background:var(--pbg);border-radius:22px;padding:22px 20px 18px;margin-bottom:18px;position:relative;overflow:hidden;
  color:var(--pink);transition:background .3s,color .3s}
.d-mono{position:absolute;left:-6px;top:-18px;font-family:var(--display);font-weight:800;font-size:84px;opacity:.14;line-height:1;
  letter-spacing:-2px;z-index:0;pointer-events:none;transition:color .3s}
.d-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;position:relative;z-index:1}
.d-tag{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;opacity:.8}
.d-share{flex:none;width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.55);color:var(--pink);border:0;
  display:grid;place-items:center;transition:background .15s,transform .12s}
.d-share:active{transform:scale(.92)}
.d-share svg{width:16px;height:16px}
.d-code{font-family:var(--display);font-weight:800;font-size:25px;line-height:1.15;margin:3px 0 4px;position:relative;z-index:1}
.d-sub{font-size:12.5px;font-weight:600;opacity:.8;margin-bottom:12px;position:relative;z-index:1}
.d-text{font-size:15px;line-height:1.6;color:var(--ink);background:var(--card);border-radius:14px;padding:14px 16px;
  position:relative;z-index:1;box-shadow:0 1px 2px rgba(40,25,10,.05)}
.d-quote{font-style:italic}
.d-note{font-size:12.5px;margin-top:13px;opacity:.9;position:relative;z-index:1;display:flex;gap:7px;align-items:flex-start}
.d-note svg{flex:none;width:14px;height:14px;margin-top:1px;opacity:.75}
.d-note b{font-weight:700;opacity:1}

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 2px 10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.chip{border:0;border-radius:12px;background:var(--cb);color:var(--ci);font-size:12.5px;font-weight:600;letter-spacing:.3px;min-height:44px;padding:8px 10px;
  text-align:left;transition:transform .12s,box-shadow .2s;box-shadow:inset 0 0 0 1.5px transparent}
.grid4 .chip{text-align:center}
.chip small{display:block;font-size:11px;font-weight:400;letter-spacing:0;opacity:.8;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip:active{transform:scale(.96)}
.chip[aria-pressed=true]{box-shadow:inset 0 0 0 1.5px var(--ci),0 2px 8px rgba(60,40,20,.10)}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:14px;background:var(--orange);color:var(--ink);font-weight:700;font-size:14px;padding:0 18px;text-decoration:none;margin-top:18px;box-shadow:0 6px 18px rgba(247,148,29,.35);transition:transform .12s}
.cta:active{transform:scale(.98)}
.cta svg{width:18px;height:18px}
.back-btm{display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;margin-top:20px;border-radius:14px;
  border:1.5px solid var(--line);color:var(--muted);font-size:13.5px;font-weight:600;text-decoration:none}
.back-btm svg{width:16px;height:16px}
.back-btm:active{background:var(--tint)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(120px);
  background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:13.5px;z-index:60;transition:transform .3s;
  max-width:calc(100vw - 40px);text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.foot{font-size:12px;color:var(--muted);text-align:center;padding-block:18px calc(90px + env(safe-area-inset-bottom))}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--line);display:flex;justify-content:space-between;padding:7px 4px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -2px 14px rgba(0,0,0,.06)}
.bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;text-decoration:none;color:var(--muted);font-size:10.5px;font-weight:600;border-radius:12px;min-width:0}
.bottomnav a svg{width:22px;height:22px}
.bottomnav a.active{color:var(--red-text);background:rgba(232,67,26,.10)}
  .bottomnav a.active svg{stroke-width:2.4}
.bottomnav a.ioite{color:#B4740A}
.bottomnav a.ioite svg{color:var(--orange)}
.bottomnav a.ioite.active{color:#8A5200;background:rgba(247,148,29,.18)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<header class="wrap">

  <h1>Kenali tipemu</h1>

<main class="wrap">

  </section>

  <section id="panel-paraga" role="tabpanel" aria-labelledby="tab-paraga" hidden>
    <div class="detail" id="paragaCard" aria-live="polite"></div>
    <div class="grid2" id="paragaGrid"></div>
    <a class="cta" href="https://lakonprofile.com/tes/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3m0 12v3m9-9h-3M6 12H3m14.5-6.5-2 2m-9 9-2 2m0-13 2 2m9 9 2 2"/><circle cx="12" cy="12" r="3.2"/></svg>Tes Paragamu di Lakon</a>
    <a class="back-btm" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>Kembali ke Main</a>
  </section>
</main>

<script>
try{ history.scrollRestoration = "manual"; }catch(e){}
const MBTI = [["INTJ", "Tuhan, jaga aku tetap terbuka pada ide orang lain, SALAH pun mereka.", "INTJ punya rencana matang dan keyakinan kuat, jadi terbuka pada ide orang lain adalah tantangan.", "NT"], ["INTP", "Tuhan, bantu aku tidak terlalu mandiri, tapi biarkan aku melakukannya dengan caraku.", "INTP suka mengurai masalah dengan caranya sendiri, sering di luar prosedur.", "NT"], ["ENTJ", "Tuhan, bantu aku melambatdantidakterburu-burudalammengerjakanapayangkulakukan.", "ENTJ berorientasi target dan bergerak cepat, ingin semuanya maju sekarang.", "NT"], ["ENTP", "Tuhan, bantu aku mengikuti prosedur yang berlaku hari ini. Eh, pikir-pikir lagi, beberapa menit saja sudah cukup.", "ENTP suka menantang aturan dan mencari cara baru, bahkan saat berdoa.", "NT"], ["INFJ", "Tuhan, bantu aku tidak jadi perfeksionis. (Tadi ejaannya sudah benar, kan?)", "INFJ berstandar tinggi dan suka memeriksa ulang, bahkan doanya pun dikoreksi.", "NF"], ["INFP", "Tuhan, bantu aku menyelesaikan semua yang kumu", "INFP penuh ide dan proyek bermakna, tapi ide baru sering datang sebelum yang lama selesai.", "NF"], ["ENFJ", "Tuhan, bantu aku mengerjakan yang mampu kukerjakan saja dan mempercayakan sisanya pada-Mu. Boleh minta itu dibuat tertulis?", "ENFJ suka memikul banyak hal demi orang lain, dan ingin kepastian yang jelas.", "NF"], ["ENFP", "Tuhan, bantu aku fokus pada satu ha-Lihat, ada burung!-l dalam satu waktu.", "ENFP penuh antusiasme, dan perhatiannya mudah melompat ke hal menarik berikutnya.", "NF"], ["ISTJ", "Tuhan, bantu aku santai soal hal-hal sepele mulai besok pukul 11.41.23 WIB.", "ISTJ menyukai detail, jadwal, dan ketepatan. Belajar santai pun perlu dijadwalkan.", "SJ"], ["ISFJ", "Tuhan, bantu aku lebih santai, dan bantu aku melakukannya dengan TEPAT SEKALI.", "ISFJ teliti dan ingin semuanya beres untuk orang lain, termasuk urusan bersantai.", "SJ"], ["ESTJ", "Tuhan, bantu aku tidak mengatur SEMUANYA. Tapi kalau Engkau butuh bantuan, bilang saja.", "ESTJ terbiasa memimpin dan mengatur, dan gatal melihat sesuatu yang belum tertata.", "SJ"], ["ESFJ", "Tuhan, beri aku kesabaran, dan maksudku SEKARANG JUGA.", "ESFJ ingin semuanya lancar dan beres cepat demi orang di sekitarnya, jadi menunggu itu berat.", "SJ"], ["ISTP", "Tuhan, bantu aku peduli pada perasaan orang, walau kebanyakan dari mereka SANGAT baperan.", "ISTP mengandalkan logika dan cenderung blak-blakan, jadi perasaan orang sering luput dari radar.", "SP"], ["ISFP", "Tuhan, bantu aku membela hakku (kalau Engkau tidak keberatan aku memintanya).", "ISFP lembut dan menghindari konflik, sampai sungkan meminta hak yang wajar.", "SP"], ["ESTP", "Tuhan, bantu aku bertanggung jawab atas perbuatanku sendiri, meski biasanya itu BUKAN salahku.", "ESTP bergerak cepat dan spontan, lalu sering merasa keadaanlah yang salah.", "SP"], ["ESFP", "Tuhan, bantu aku lebih serius, terutama soal pesta dan berdansa.", "ESFP hidup di saat ini dan pandai menghidupkan suasana. Serius itu urusan nanti.", "SP"]];
const TEMP = {"NT": ["Rational", "#E9E0F5", "#5E4390"], "NF": ["Idealist", "#DCEFE2", "#2B6E42"], "SJ": ["Guardian", "#DCE8F5", "#2C5A86"], "SP": ["Artisan", "#FDE6CC", "#9A500F"]};
const KELOMPOK = [["Yasa", "Membangun"], ["Nalar", "Meneliti"], ["Karya", "Mencipta"], ["Bakti", "Menumbuhkan"], ["Karsa", "Menggerakkan"], ["Tata", "Menata"]];
const KCOL = [["#F8DECF", "#93421C"], ["#DCE8F5", "#2C5A86"], ["#E9E0F5", "#5E4390"], ["#DCEFE2", "#2B6E42"], ["#FDE6CC", "#9A500F"], ["#F1E8CC", "#6E5A18"]];
const WATAK = [["Reka", "Penerang Makna"], ["Logika", "Pemikir Sistem"], ["Jaga", "Penjaga Keandalan"], ["Guna", "Penggerak Nyata"]];
const PARAGA = [[["The Visionary Maker", "Membangun hal nyata yang berangkat dari visi. Puas saat hasilnya bermakna bagi orang lain."], ["The Systems Engineer", "Merancang dan membangun sistem teknis yang efisien dan masuk akal."], ["The Master Craftsperson", "Menguasai keahlian tangan dengan tekun, rapi, dan konsisten mutunya."], ["The Field Expert", "Cekatan di lapangan. Cepat membaca situasi dan langsung menyelesaikan masalah nyata."]], [["The Meaning-Seeker", "Meneliti untuk menemukan makna di balik data dan gagasan."], ["The Pure Analyst", "Menganalisis dengan logika murni. Suka teori, model, dan konsep yang tajam."], ["The Methodical Investigator", "Meneliti dengan metode yang teliti dan runtut sampai hasilnya bisa dipercaya."], ["The Applied Problem-Solver", "Memakai analisis untuk memecahkan masalah praktis dengan cepat."]], [["The Visionary Storyteller", "Mencipta karya yang menyampaikan cerita dan makna."], ["The Creative Architect", "Merancang karya kreatif dengan konsep dan struktur yang matang."], ["The Master of Craft", "Mengasah teknik hingga presisi dan menjaga mutu setiap karya."], ["The Spontaneous Creator", "Mencipta spontan dan luwes. Langsung mencoba, lalu menyempurnakan."]], [["The Human Developer", "Menumbuhkan orang dengan membantu mereka menemukan potensi dan makna."], ["The System of People", "Menumbuhkan orang lewat sistem yang tertata, seperti program, kerangka, dan alur belajar."], ["The Reliable Guardian", "Hadir dengan andal untuk merawat dan menjaga orang di sekitarnya."], ["The Hands-On Helper", "Menolong langsung lewat tindakan nyata yang terasa manfaatnya."]], [["The Vision-Led Entrepreneur", "Menggerakkan orang dengan visi besar dan semangat yang menular."], ["The Strategic Operator", "Menggerakkan bisnis lewat strategi dan perhitungan yang tajam."], ["The Institution Builder", "Membangun organisasi yang kokoh dan tahan lama."], ["The Relationship Driver", "Menggerakkan hasil lewat relasi. Piawai membangun jejaring dan bernegosiasi."]], [["The Purpose-Driven Organizer", "Menata pekerjaan supaya selaras dengan tujuan dan nilai."], ["The Systems Innovator", "Menata dengan memperbaiki sistem dan proses agar makin efisien."], ["The Reliable Foundation", "Menjadi fondasi yang rapi, konsisten, dan bisa diandalkan tim."], ["The Pragmatic Executor", "Menata dan menuntaskan pekerjaan dengan praktis dan cepat."]]];

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const reveal = el => { const r = el.getBoundingClientRect(); if(r.top < 60 || r.bottom > innerHeight) el.scrollIntoView({block:"center", behavior: reduce ? "auto" : "smooth"}); };
const paint = (el, bg, ink) => { el.style.setProperty("--pbg", bg); el.style.setProperty("--pink", ink); };

function setTab(name){
  document.querySelectorAll("[data-tab]").forEach(t => t.setAttribute("aria-selected", String(t.dataset.tab === name)));
  $("#panel-mbti").hidden = name !== "mbti";
  $("#panel-paraga").hidden = name !== "paraga";
  try{ history.replaceState(null, "", "#" + name); }catch(e){}
}
document.querySelectorAll("[data-tab]").forEach(t => t.addEventListener("click", () => setTab(t.dataset.tab)));
if(location.hash === "#paraga") setTab("paraga");
scrollTo(0, 0);

// MBTI
$("#mbtiLegend").innerHTML = Object.values(TEMP).map(t => `<span style="--c:${t[2]}"><i></i>${t[0]}</span>`).join("");
$("#mbtiGrid").innerHTML = MBTI.map((m,i) => { const t = TEMP[m[3]]; return `<button class="chip" data-i="${i}" aria-pressed="false" style="--cb:${t[1]};--ci:${t[2]}">${m[0]}</button>`; }).join("");
function showMbti(i){
  const m = MBTI[i], t = TEMP[m[3]], card = $("#mbtiCard");
  document.querySelectorAll("#mbtiGrid .chip").forEach(c => c.setAttribute("aria-pressed", String(+c.dataset.i === i)));
  paint(card, t[1], t[2]);
  card.innerHTML = `<div class="d-mono">${m[0].slice(0,2)}</div>
    <div class="d-top"><span class="d-tag">${t[0]}</span><button class="d-share" data-share="mbti" data-i="${i}" aria-label="Bagikan ${m[0]}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 10.6 6.8-3.8M8.6 13.4l6.8 3.8"/></svg></button></div>
    <div class="d-code">${m[0]}</div>
    <p class="d-text d-quote">${esc(m[1])}</p>
    <p class="d-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 17v.01M12 13.5a1.8 1.8 0 1 0-1.8-1.8"/><circle cx="12" cy="12" r="9"/></svg><span><b>Maksudnya:</b> ${esc(m[2])}</span></p>`;
}
$("#mbtiGrid").addEventListener("click", e => { const b = e.target.closest(".chip"); if(!b) return; showMbti(+b.dataset.i); reveal($("#mbtiCard")); });
showMbti(0);

// Paraga
let cells = [];
KELOMPOK.forEach((k,ki) => WATAK.forEach((w,wi) => cells.push([ki,wi])));
$("#paragaGrid").innerHTML = cells.map(([ki,wi],n) => `<button class="chip" data-n="${n}" aria-pressed="false" style="--cb:${KCOL[ki][0]};--ci:${KCOL[ki][1]}">${KELOMPOK[ki][0]} ${WATAK[wi][0]}<small>${esc(PARAGA[ki][wi][0].replace(/^The /,""))}</small></button>`).join("");
function showParaga(n){
  const [ki,wi] = cells[n], p = PARAGA[ki][wi], card = $("#paragaCard");
  document.querySelectorAll("#paragaGrid .chip").forEach(c => c.setAttribute("aria-pressed", String(+c.dataset.n === n)));
  paint(card, KCOL[ki][0], KCOL[ki][1]);
  card.innerHTML = `<div class="d-mono">${KELOMPOK[ki][0].slice(0,1)}${WATAK[wi][0].slice(0,1)}</div>
    <div class="d-top"><span class="d-tag">${KELOMPOK[ki][1]}</span><button class="d-share" data-share="paraga" data-n="${n}" aria-label="Bagikan ${KELOMPOK[ki][0]} ${WATAK[wi][0]}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 10.6 6.8-3.8M8.6 13.4l6.8 3.8"/></svg></button></div>
    <div class="d-code">${KELOMPOK[ki][0]} ${WATAK[wi][0]}</div>
    <div class="d-sub">${esc(p[0])}</div>
    <p class="d-text">${esc(p[1])}</p>
    <p class="d-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 17v.01M12 13.5a1.8 1.8 0 1 0-1.8-1.8"/><circle cx="12" cy="12" r="9"/></svg><span><b>${KELOMPOK[ki][0]}</b> ${KELOMPOK[ki][1].toLowerCase()} · <b>${WATAK[wi][0]}</b> ${WATAK[wi][1].toLowerCase()}</span></p>`;
}
$("#paragaGrid").addEventListener("click", e => { const b = e.target.closest(".chip"); if(!b) return; showParaga(+b.dataset.n); reveal($("#paragaCard")); });
showParaga(0);

// bagikan kartu
function toast(t){
  let el = $("#toast");
  if(!el){ el = document.createElement("div"); el.id = "toast"; el.className = "toast"; document.body.appendChild(el); }
  el.textContent = t; el.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("show"), 3000);
}
async function shareCard(type, idx){
  let title, text, url;
  if(type === "mbti"){
    const m = MBTI[idx], t = TEMP[m[3]];
    title = `${m[0]} \u00b7 Kenali Tipemu`;
    text = `${m[0]} \u2014 ${t[0]}\n\u201C${m[1]}\u201D\n\nMaksudnya: ${m[2]}\n\nKenali tipemu di Mitologi Inspira:`;
    url = "https://mitologiinspira.com";
  } else {
    const [ki,wi] = cells[idx], p = PARAGA[ki][wi];
    title = `${KELOMPOK[ki][0]} ${WATAK[wi][0]} \u00b7 24 Paraga Lakon`;
    text = `${KELOMPOK[ki][0]} ${WATAK[wi][0]} \u2014 ${p[0]}\n${p[1]}\n\nCari tahu Paragamu di Lakon:`;
    url = "https://lakonprofile.com";
  }
  if(navigator.share){
    try{ await navigator.share({ title, text, url }); return; }catch(e){ if(e && e.name === "AbortError") return; }
  }
  try{ await navigator.clipboard.writeText(`${text} ${url}`); toast("Disalin. Tempel di chat manapun untuk membagikan."); }
  catch(e){ toast("Tidak bisa membagikan otomatis di peramban ini."); }
}
document.addEventListener("click", e => {
  const b = e.target.closest(".d-share"); if(!b) return;
  const type = b.dataset.share, idx = type === "mbti" ? +b.dataset.i : +b.dataset.n;
  shareCard(type, idx);
});

if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js");
</script>
